<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <!-- row 1: photos to pattern -->
    <rect x="20" y="40" width="140" height="64" rx="8" fill="#f2f2f2" stroke="#999"/>
    <text x="90" y="66" font-weight="bold">3 phone photos</text>
    <text x="90" y="86" fill="#444">+ 100 mm marker</text>

    <rect x="200" y="40" width="140" height="64" rx="8" fill="#e3effb" stroke="#4C6F96"/>
    <text x="270" y="66" font-weight="bold">SAM 3.1</text>
    <text x="270" y="86" fill="#444">t-shirt, sleeve masks</text>

    <rect x="380" y="40" width="140" height="64" rx="8" fill="#f2f2f2" stroke="#999"/>
    <text x="450" y="66" font-weight="bold">Code</text>
    <text x="450" y="86" fill="#444">outlines in mm</text>

    <rect x="560" y="40" width="140" height="64" rx="8" fill="#e3effb" stroke="#4C6F96"/>
    <text x="630" y="66" font-weight="bold">Muse Spark 1.3</text>
    <text x="630" y="86" fill="#444">neck depths, grain</text>

    <rect x="740" y="40" width="200" height="64" rx="8" fill="#e6f4ec" stroke="#2F7A4B"/>
    <text x="840" y="66" font-weight="bold">Seam check (code)</text>
    <text x="840" y="86" fill="#444">fails: never exported</text>

    <line x1="160" y1="72" x2="198" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="340" y1="72" x2="378" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="520" y1="72" x2="558" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="700" y1="72" x2="738" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- row 2: outputs -->
    <line x1="840" y1="104" x2="840" y2="160" stroke="#555" stroke-width="1.5"/>
    <line x1="140" y1="160" x2="840" y2="160" stroke="#555" stroke-width="1.5"/>
    <line x1="140" y1="160" x2="140" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="400" y1="160" x2="400" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="660" y1="160" x2="660" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="40" y="190" width="200" height="64" rx="8" fill="#f2f2f2" stroke="#999"/>
    <text x="140" y="216" font-weight="bold">Pattern files</text>
    <text x="140" y="236" fill="#444">tiled A4 PDF 1:1, SVG, DXF</text>

    <rect x="300" y="190" width="200" height="64" rx="8" fill="#f2f2f2" stroke="#999"/>
    <text x="400" y="216" font-weight="bold">Manufacturing files</text>
    <text x="400" y="236" fill="#444">cut plan, cut path, BOM</text>

    <rect x="560" y="190" width="200" height="64" rx="8" fill="#e3effb" stroke="#4C6F96"/>
    <text x="660" y="216" font-weight="bold">Co-pilot (Muse Spark)</text>
    <text x="660" y="236" fill="#444">plain-English edit, code applies</text>
  </g>
  <g font-size="11" fill="#666">
    <rect x="20" y="276" width="12" height="12" fill="#e3effb" stroke="#4C6F96"/>
    <text x="38" y="286">Meta model</text>
    <rect x="120" y="276" width="12" height="12" fill="#f2f2f2" stroke="#999"/>
    <text x="138" y="286">code, no model call</text>
  </g>
</svg>
