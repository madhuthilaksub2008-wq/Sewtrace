# The one Sewtrace config file (REQ-API-05, REQ-SEG-02, SPEC 7.6.1).
# Prices are USD per 1M tokens, or per image where noted. SPEC 4.2 note 2:
# the Meta pricing page is the authority. Change a value here, not in code.

[api]
base_url = "https://api.meta.ai/v1"
timeout_s = 120.0          # one request; reasoning calls are slow (REQ-API-07)
max_tries = 3              # tries per call on HTTP 429 or 5xx (REQ-API-06)
backoff_s = 2.0            # wait before try n+1 is backoff_s * 2 ** (n - 1)
budget_limit_usd = 140.0   # SPEC 8.3 "any day": stop all paid calls (REQ-API-04, C-01)
offline = false            # true, or SEWTRACE_OFFLINE=1: cache only, no mock, no network

[models.sam]
id = "sam-3.1"             # SPEC 4.2 note 1: confirm against "sam-3-1" in the Day 1 test
price_per_image_usd = 0.0025

[models.spark]
id = "muse-spark-1.3"
input_per_m_usd = 1.25
cached_input_per_m_usd = 0.15
output_per_m_usd = 4.25

[models.spark_contributor]  # trains on your data: synthetic photos only (SPEC 4.3, item 5)
id = "muse-spark-1.3-contributor"
input_per_m_usd = 0.10
cached_input_per_m_usd = 0.10  # SPEC 4.2 lists no cached price; use the input price
output_per_m_usd = 0.20

[models.wonder]
id = "muse-wonder-1.0"
input_per_m_usd = 4.00
cached_input_per_m_usd = 0.20
output_per_m_usd = 20.00

[models.image]
id = "muse-image-1.0"
price_per_image_usd = 0.01

[reasoning]
model = "spark"            # key under [models]: spark, spark_contributor or wonder
# SPEC 8.1 prices the worst case at "high". Allowed: minimal low medium high xhigh max.
# "none" is rejected: the API answers HTTP 400 (SPEC 4.3, item 6).
effort = "high"
# SPEC 8.1 assumes about 15,000 output tokens (reasoning plus JSON) for a panel call.
# 32,000 gives about 2x headroom so the JSON is not cut off (REQ-RSN-06). Worst case
# for one Spark call at this limit is about $0.14 output cost, which the budget guard
# uses as its estimate.
max_tokens = 32000
est_image_tokens = 1500    # SPEC 8.1 assumption, for the pre-call budget estimate

[sam]
min_score = 0.5            # drop masks below this score (unconfirmed API field; Day 1 test)

[sam.prompts]              # REQ-SEG-02
garment = "t-shirt"        # front, back and the t-shirt in the proof photo
sleeve = "sleeve"
paper = "paper"
# TEMPORARY (fix item 3 removes it): mock SAM sidecars are body-only masks named "body".
mock_body = "body"

[seam]                     # SPEC 7.6.1, mm
shoulder_tol_mm = 1.0
side_tol_mm = 1.0
underarm_tol_mm = 1.0
cap_ease_min_mm = 0.0      # open decision D-03
cap_ease_max_mm = 12.0
max_adjust_calls = 3       # REQ-SEW-02

[pattern]
seam_allowance_mm = 10.0   # REQ-OUT-03
neckband_allowance_mm = 6.0
chest_drop_mm = 25.0       # chest drop; not read by code yet (measurement definitions, fix item 6)

[proof]
gap_tolerance_mm = 3.0     # REQ-VER-03

[marker]
tolerance_mm = 1.0
