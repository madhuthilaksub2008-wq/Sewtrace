name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the suite takes about 12 minutes
    env:
      META_API_KEY: ""    # C-08: CI never has a key and never makes a paid call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check sewtrace tests
      - run: pytest -q
